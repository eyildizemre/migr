name: CI

# Every run takes the suite as root, the suite on other distributions,
# every gate of `make check` in a clean Fedora, the fault sweep, and the
# coverage of all of these: a fresh machine finds what the developer's own
# one hides. Pushes that change nothing the build or the tests read (the
# same files the pre-commit hook looks at) are skipped, and so are tag
# pushes: a tag names a commit that already ran here from main.
on:
  push:
    branches: ['**']
    paths:
      - '**.c'
      - '**.h'
      - '**.sh'
      - '**/Makefile'
      - 'tests/stubs/**'
      - 'tests/fuzz/corpus/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-test:
    name: Test as root (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the tools the root phases use
        run: sudo apt-get update && sudo apt-get install -y dosfstools socat
      - name: make test as root
        run: sudo env -u SUDO_UID make test

  debian-test:
    name: Test (Debian 12)
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      # git also gives the image a second package installed by hand: Phase 5
      # reads a one-line package list as one that lost its line breaks.
      - name: Install build tools
        run: apt-get update && apt-get install -y build-essential git
      - uses: actions/checkout@v7
      - name: make test
        run: .github/scripts/run-as-builder.sh make test

  arch-test:
    name: Test (Arch Linux)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel
      - uses: actions/checkout@v7
      - name: make test
        run: .github/scripts/run-as-builder.sh make test

  full-check:
    name: make check (Fedora 44)
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      # LeakSanitizer stops the process's threads through ptrace.
      options: --cap-add SYS_PTRACE
    steps:
      - name: Install build tools
        run: >-
          dnf install -y gcc clang make glibc-static libasan libubsan
          valgrind socat util-linux
      - uses: actions/checkout@v7
      - name: make check
        run: .github/scripts/run-as-builder.sh make check

  fault-sweep:
    name: Fault sweep (Ubuntu, root)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the tools the portable scenarios use
        run: sudo apt-get update && sudo apt-get install -y dosfstools
      - name: make fault-sweep as root
        run: sudo env -u SUDO_UID make fault-sweep

  # Counters add up across the runs on one coverage build: the suite as root
  # takes the root phases, as the runner's user the unprivileged paths, and
  # the sweep the failure paths. A per-file table goes to the run's summary
  # and the annotated source, which shows the lines missed, to the coverage
  # artifact.
  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the tools the root phases and the report use
        run: |
          sudo apt-get update && sudo apt-get install -y dosfstools socat
          pipx install gcovr==8.6
      - name: Run the suite and the sweep on a coverage build
        run: |
          gcc -c -O0 -o "$RUNNER_TEMP/gcov_exit.o" tests/gcov_exit.c
          flags="-g -O0 --coverage -Wl,--wrap=_exit $RUNNER_TEMP/gcov_exit.o"
          sudo env -u SUDO_UID make -j4 CFLAGS="$flags" test
          sudo chown -R "$(id -u):$(id -g)" .
          make -j4 CFLAGS="$flags" test
          sudo env -u SUDO_UID make CFLAGS="$flags" fault-sweep
          sudo chown -R "$(id -u):$(id -g)" .
      - name: Report
        run: |
          mkdir coverage
          gcovr --root . --filter src/ --merge-mode-functions=separate \
              --json-summary coverage/summary.json \
              --html-details coverage/index.html
          python3 .github/scripts/coverage_summary.py coverage/summary.json \
              >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
